name: Client Build Actions for Hemis

on:
  workflow_dispatch:
    inputs:
     release:
       type: boolean
       description: 'Tick = Release, No tick = Pre-release'
       required: true
     tags:
      description: 'Set tag for release'
      required: true
     release-name:
       description: 'Specify a name for release'
       required: true
jobs:
  lint:
    env:
      SHELLCHECK_VERSION: v0.7.1
      LC_ALL: C
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Initialize Pythonupstream/main
        uses: actions/setup-python@v5
        with:
          python-version: 3.8

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install codespell==2.2.5
          pip install flake8==5.0.4
          pip install mypy==1.4.1
          pip install vulture==2.6
          pip install yq

          curl -sL "https://github.com/koalaman/shellcheck/releases/download/${SHELLCHECK_VERSION}/shellcheck-${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" | tar --xz -xf - --directory /tmp/

      - name: Lint
        run: |
          export PATH="/tmp/shellcheck-${SHELLCHECK_VERSION}:${PATH}"
          echo $PATH

          git checkout -qf $GITHUB_SHA

  build_depends:
    name: Depends-${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    needs: lint
    # ★ Run #1's build_depends ran for 6h and was cancelled by the repository
    # timeout, taking the whole run with it. Its two cancelled legs were then
    # re-run by hand and went green in 24m0s (ARM32) and 26m22s (macOS), so a
    # cold, uncached depends build is a ~25m job and 45m is generous headroom.
    # A leg past that is stuck, and failing it at 45m leaves the other legs'
    # results readable instead of losing the whole run at the 6h mark.
    #
    # This bounds the damage; it does not explain it. Run #1's logs were 403
    # and the cause of the 6h leg is UNDETERMINED.
    timeout-minutes: 45
    env:
      APT_BASE: ccache
      SDK_URL: https://bitcoincore.org/depends-sources/sdks
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
         # ★ TESTNET-RELEASE EXPEDIENT -- NOT PERMANENT. Matched to the
         # build_depends_wallet matrix restriction below; the full rationale and
         # the restore instruction are in the marker at that matrix. Restore both
         # together: a depends leg with no wallet leg builds toolchains nobody
         # consumes, and a wallet leg with no depends leg cannot build at all.
         # - name: ARM 32-bit
           # os: ubuntu-22.04
           # host: arm-linux-gnueabihf
           # apt_get: python3 g++-arm-linux-gnueabihf

         # - name: AARCH64
           # os: ubuntu-22.04
           # host: aarch64-linux-gnu
           # apt_get: python3 g++-aarch64-linux-gnu

         # - name: Win64
           # os: ubuntu-22.04
           # host: x86_64-w64-mingw32
           # apt_get: python3 nsis g++-mingw-w64-x86-64 wine-binfmt wine64

         - name: x86_64 Linux
           os: ubuntu-22.04
           host: x86_64-unknown-linux-gnu
           apt_get: python3-zmq
           dep_opts: DEBUG=1

         # - name: macOS 10.12
           # os: ubuntu-22.04
           # host: x86_64-apple-darwin16
           # apt_get: cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python3-dev python3-setuptools libtinfo5 libncurses5 xorriso
           # XCODE_VERSION: 11.3.1
           # XCODE_BUILD_ID: 11C505

    steps:
      - name: Get Source
        uses: actions/checkout@v4
        with:
          # ★★ ODC-092, THIRD LINK. actions/checkout defaults to fetch-depth: 1 --
          # a shallow fetch that retrieves the commit but NO TAG OBJECTS. genbuild.sh
          # then has nothing to `git describe` against and falls back to the commit
          # suffix, so a correctly-created annotated tag STILL produced
          # "v1.3.1.0-c13a6ef" instead of "v0.2.0-testnet". The lint job already had
          # fetch-depth: 0; the jobs that actually BUILD did not.
          fetch-depth: 0
        # ★ Non-interactive apt -- hardening, not a diagnosis. See the same
        # note on build_depends_wallet's Setup Environment step.
        run: |
          sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-upgrade -qq "$APT_BASE" ${{ matrix.config.apt_get }}

      - name: depends cache files
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sdk-sources
            depends/${{ matrix.config.host }}
          key: ${{ runner.os }}-depends-${{ matrix.config.host }}
          restore-keys: ${{ runner.os }}-depends-${{ matrix.config.host }}

      - name: Build Depends
        run: |
          export LC_ALL=C.UTF-8

          PATH=$(echo $PATH | tr ':' "\n" | sed '/\/opt\/python/d' | tr "\n" ":" | sed "s|::|:|g")
          # Add llvm-symbolizer directory to PATH. Needed to get symbolized stack traces from the sanitizers.
          PATH=$PATH:/usr/lib/llvm-6.0/bin/
          export PATH

          mkdir -p depends/SDKs depends/sdk-sources

          OSX_SDK_BASENAME="Xcode-${{ matrix.config.XCODE_VERSION }}-${{ matrix.config.XCODE_BUILD_ID }}-extracted-SDK-with-libcxx-headers.tar.gz"
          OSX_SDK_PATH="depends/sdk-sources/${OSX_SDK_BASENAME}"

          if [ -n "${{ matrix.config.XCODE_VERSION }}" ] && [ ! -f "$OSX_SDK_PATH" ]; then
            curl --location --fail "${SDK_URL}/${OSX_SDK_BASENAME}" -o "$OSX_SDK_PATH"
          fi

          if [ -n "${{ matrix.config.XCODE_VERSION }}" ] && [ -f "$OSX_SDK_PATH" ]; then
            tar -C "depends/SDKs" -xf "$OSX_SDK_PATH"
          fi

          if [[ ${{ matrix.config.host }} = *-mingw32 ]]; then
            BIN=$(which ${{ matrix.config.host }}-g++-posix)
            sudo update-alternatives --set ${{ matrix.config.host }}-g++ $BIN
          fi

          if [ -z "${{ matrix.config.no_depends }}" ]; then
            make -j2 -C depends HOST=${{ matrix.config.host }} ${{ matrix.config.dep_opts }}
          fi

  build_depends_wallet:
    name: ${{ matrix.config.name }}
    runs-on: ${{ matrix.config.os }}
    needs: [lint, build_depends]
    env:
      APT_BASE: ccache
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_SIZE: 500M
      CCACHE_COMPRESS: 1
      PARAMS_DIR: ${{ github.workspace }}/.hemis-params
      WINEDEBUG: fixme-all
      BOOST_TEST_RANDOM: 1 # random seed based on the current time
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        config:
          # ==================================================================
          # ★ TESTNET-RELEASE EXPEDIENT -- NOT PERMANENT, NOT A POLICY CHANGE.
          #
          # Only the x86_64 Linux leg is left active. v0.1.0-testnet ships Linux
          # binaries only: install.sh's artefact route fetches Hemis-Linux.tar.gz
          # (testnet/operator/install.sh:341-347) and never asks for a Windows,
          # macOS or ARM artefact. The other four legs cost wall-clock and nothing
          # else, and :149's `needs: [lint, build_depends]` is a WHOLE-MATRIX
          # barrier -- the Linux wallet job waits on every depends leg including
          # the four whose output it will not read. Run #1 sat 5h38m on exactly
          # that, with its own depends output finished and unused.
          #
          # Nothing downstream needs editing to match: every packaging and upload
          # step below is already guarded on `matrix.config.host == ...`
          # (:364, :368, :372, :379, :389, :393, and the uploads :398-495), so a
          # disabled leg SKIPS its steps rather than failing them.
          #
          # TO RESTORE -- AND THIS IS NOT UNIFORM ACROSS THE FOUR, see BUG-043:
          #   Win64      -- delete the leading "# " here and in build_depends at
          #                 :68. Nothing else. blst's coff/ assembly is present and
          #                 is now shipped by BLST_DIST (src/Makefile.am:887).
          #   ARM 32-bit -- same, one character. 32-bit takes blst's empty asm
          #                 branch and the pure-C path; note Makefile.am:113's
          #                 stack warning applies to it and is unexamined.
          #   macOS      -- BLOCKED. blst/build/mach-o/ DOES NOT EXIST in this
          #                 repository; assembly.S:63 includes 13 files that are
          #                 not there.
          #   AARCH64    -- BLOCKED. No *-armv8.* files under any ABI;
          #                 assembly.S:99 includes 10 files that are not there.
          # Uncommenting the macOS or AARCH64 entry produces a compile failure, not
          # a build. Answer BUG-043 first. These platforms are deferred, not
          # dropped -- but two of them are deferred behind a real question.
          # ==================================================================
          # - name: ARM 32-bit
            # id: ARM32
            # os: ubuntu-22.04
            # host: arm-linux-gnueabihf
            # apt_get: python3 g++-arm-linux-gnueabihf
            # unit_tests: false
            # functional_tests: false
            # goal: install
            # # -Wno-psabi is to disable ABI warnings: "note: parameter passing for argument of type ... changed in GCC 7.1"
            # # This could be removed once the ABI change warning does not show up by default
            # BITCOIN_CONFIG: "--with-gui=qt5 --enable-glibc-back-compat --enable-reduce-exports --disable-online-rust CXXFLAGS=-Wno-psabi --disable-tests --disable-bench"

          # - name: AARCH64
            # id: ARM64
            # os: ubuntu-22.04
            # host: aarch64-linux-gnu
            # apt_get: python3 g++-aarch64-linux-gnu
            # unit_tests: false
            # functional_tests: false
            # goal: install
            # BITCOIN_CONFIG: "--with-gui=qt5 --enable-glibc-back-compat --enable-reduce-exports --disable-online-rust --disable-tests --disable-bench"

          # - name: Win64
            # id: Win64
            # os: ubuntu-22.04
            # host: x86_64-w64-mingw32
            # apt_get: python3 nsis g++-mingw-w64-x86-64 wine-binfmt wine64
            # unit_tests: false
            # functional_tests: false
            # symbol_check: true
            # goal: deploy
            # BITCOIN_CONFIG: "--with-gui=auto --enable-reduce-exports --disable-online-rust --disable-tests --disable-bench"

          - name: x86_64 Linux
            id: Linux-x86_64
            os: ubuntu-22.04
            host: x86_64-unknown-linux-gnu
            apt_get: python3-zmq
            unit_tests: false
            functional_tests: false
            # ★ "install-strip", NOT "install". This is the release path, and it was the
            # ONE place in the tooling that shipped unstripped binaries. install.sh:282
            # strips on the source-build path and says why at :278-281 -- "the builder
            # image that produced the fleet strips, and it matters" -- so the route every
            # operator will actually take was the untested one. Measured on the rehearsal
            # release: 446MB in the tarball against 107MB stripped.
            #
            # This is automake's own target (Makefile.in:1101, src/Makefile.in:12903), not
            # a bolted-on strip step. It re-runs "install" with INSTALL_PROGRAM set to
            # INSTALL_STRIP_PROGRAM, so the binaries arrive at --bindir=$OUTDIR_PATH/bin
            # (:392) ALREADY STRIPPED. That ordering is the point: the "Zip Linux Builds"
            # (:462) and "Tar Linux Builds" (:469) steps package that same directory, so
            # there is no window in which an unstripped binary can be copied. A separate
            # "strip" invocation after the build would have been a second mechanism to
            # keep in sync with install.sh's.
            # Safe here because the host is native x86_64: install-strip runs the build's
            # own $(STRIP), which for a cross build would be the wrong tool.
            goal: install-strip
            test_runner_extra: "--coverage --all  --exclude feature_dbcrash"
            # ★ "--without-gui", NOT the absence of --with-gui. Hemis-qt was 379MB of the
            # rehearsal tarball's 446MB -- 85% of the payload, 68MB even stripped, still
            # more than half -- for a binary that has never been executed. It does not go
            # to five operators in the artefact they need for GM work.
            #
            # Deleting the flag would NOT have worked: --with-gui defaults to "auto"
            # (build-aux/m4/bitcoin_qt.m4:56,65) and depends builds Qt for this host
            # (depends/Makefile:131, with NO_QT empty at :35), so autodetect would find it
            # and build Hemis-qt anyway. The negative has to be stated. depends still
            # builds Qt itself -- what this saves is compiling and linking Hemis's own Qt
            # sources, not the dependency build.
            #
            # COST, SAID OUT LOUD: 60ff2a1 fixed five link targets that pull in the ptx
            # objects without linking libblst.a, and qt_Hemis_qt_LDADD
            # (Makefile.qt.include:688) was the only one of the five CI could reach -- the
            # other four sit behind --disable-tests/--disable-bench. So CI now covers none
            # of them. The fix stays in the tree with its comment and was proven RED/GREEN
            # locally; re-enabling Qt is a one-token change here. Not a rejection of Qt: a
            # GUI wallet ships later as a separate artefact for a different audience, from
            # its own dispatch, where a link failure costs nothing. Today, keeping it in
            # this job lets a binary nobody ships fail the release of the ones everybody
            # needs -- which is exactly what run #3 did.
            BITCOIN_CONFIG: "--enable-zmq --without-gui --enable-glibc-back-compat --enable-reduce-exports --disable-online-rust --disable-tests --disable-bench"

          # - name: macOS 10.12
            # id: macOS10.12
            # os: ubuntu-22.04
            # host: x86_64-apple-darwin16
            # apt_get: cmake imagemagick libcap-dev librsvg2-bin libz-dev libbz2-dev libtiff-tools python3-dev python3-setuptools libtinfo5 libncurses5 xorriso
            # XCODE_VERSION: 11.3.1
            # XCODE_BUILD_ID: 11C505
            # unit_tests: false
            # functional_tests: false
            # goal: deploy
            # symbol_check: true
            # BITCOIN_CONFIG: "--enable-gui --enable-reduce-exports --enable-werror --disable-online-rust --disable-tests --disable-bench"


    steps:
      - name: Get Source
        uses: actions/checkout@v4
        with:
          # ★★ ODC-092, THIRD LINK. actions/checkout defaults to fetch-depth: 1 --
          # a shallow fetch that retrieves the commit but NO TAG OBJECTS. genbuild.sh
          # then has nothing to `git describe` against and falls back to the commit
          # suffix, so a correctly-created annotated tag STILL produced
          # "v1.3.1.0-c13a6ef" instead of "v0.2.0-testnet". The lint job already had
          # fetch-depth: 0; the jobs that actually BUILD did not.
          fetch-depth: 0
        # ★ Non-interactive apt. HARDENING AGAINST A PLAUSIBLE CAUSE, NOT A
        # DIAGNOSIS -- see the commit message. An apt-get that stops on a
        # prompt would hang exactly as run #1 hung, but run #1's logs were
        # 403 and its cause is UNDETERMINED. This does not close that.
        run: |
          if [[ ${{ matrix.config.os }} = ubuntu* ]]; then
            sudo DEBIAN_FRONTEND=noninteractive apt-add-repository "ppa:ondrej/php" -y
            sudo DEBIAN_FRONTEND=noninteractive apt-get --yes update
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends --no-upgrade -qq "$APT_BASE" ${{ matrix.config.apt_get }}
          fi
          if [[ ${{ matrix.config.os }} = macos* ]]; then
            brew install ${{ matrix.config.brew_install }}
            pip3.8 install ds_store mac_alias
          fi

      - name: depends cache files
        if: matrix.config.no_depends != 1
        uses: actions/cache@v4
        with:
          path: |
            depends/built
            depends/sdk-sources
            depends/${{ matrix.config.host }}
          key: ${{ runner.os }}-depends-${{ matrix.config.host }}
          restore-keys: ${{ runner.os }}-depends-${{ matrix.config.host }}

      - name: ccache cache files
        uses: actions/cache@v4
        with:
          path: |
            .ccache
            .hemis-params
          key: ${{ runner.os }}-depbuild-${{ matrix.config.id }}-ccache
          restore-keys: ${{ runner.os }}-depbuilt-${{ matrix.config.id }}-ccache

      - name: Build Wallet
        run: |
          export LC_ALL=C.UTF-8

          echo $CCACHE_DIR
          echo $PARAMS_DIR

          PATH=$(echo $PATH | tr ':' "\n" | sed '/\/opt\/python/d' | tr "\n" ":" | sed "s|::|:|g")
          # Add llvm-symbolizer directory to PATH. Needed to get symbolized stack traces from the sanitizers.
          PATH=$PATH:/usr/lib/llvm-6.0/bin/
          export PATH

          mkdir -p depends/SDKs depends/sdk-sources

          OSX_SDK_BASENAME="Xcode-${{ matrix.config.XCODE_VERSION }}-${{ matrix.config.XCODE_BUILD_ID }}-extracted-SDK-with-libcxx-headers.tar.gz"
          OSX_SDK_PATH="depends/sdk-sources/${OSX_SDK_BASENAME}"

          if [ -n "${{ matrix.config.XCODE_VERSION }}" ] && [ ! -f "$OSX_SDK_PATH" ]; then
            curl --location --fail "${SDK_URL}/${OSX_SDK_BASENAME}" -o "$OSX_SDK_PATH"
          fi

          if [ -n "${{ matrix.config.XCODE_VERSION }}" ] && [ -f "$OSX_SDK_PATH" ]; then
            tar -C "depends/SDKs" -xf "$OSX_SDK_PATH"
          fi

          if [[ ${{ matrix.config.host }} = *-mingw32 ]]; then
            BIN=$(which ${{ matrix.config.host }}-g++-posix)
            sudo update-alternatives --set ${{ matrix.config.host }}-g++ $BIN
            sudo update-binfmts --import /usr/share/binfmts/wine
          fi

          if [[ ${{ matrix.config.os }} = macos* ]]; then
            CC=${{ matrix.config.cc }}
            CXX=${{ matrix.config.cxx }}
            export CC
            export CXX
          fi

          if [[ ${{ matrix.config.os }} = ubuntu* ]]; then
            OUTDIR_PATH="$GITHUB_WORKSPACE/$GITHUB_RUN_NUMBER-${{ matrix.config.host }}"
            BITCOIN_CONFIG_ALL="--disable-dependency-tracking --prefix=$GITHUB_WORKSPACE/depends/${{ matrix.config.host }} --bindir=$OUTDIR_PATH/bin --libdir=$OUTDIR_PATH/lib"
          fi

          if [ "${{ matrix.config.unit_tests }}" = "true" ] || [ "${{ matrix.config.functional_tests }}" = "true" ]; then
            mkdir -p $PARAMS_DIR
            PARAMS_FLAGS="--with-params-dir=$PARAMS_DIR"
          fi

          echo ::group::Autogen
          ./autogen.sh
          echo ::endgroup::

          mkdir build && cd build

          echo ::group::Configure
          ../configure --cache-file=config.cache $BITCOIN_CONFIG_ALL ${{ matrix.config.BITCOIN_CONFIG }} $PARAMS_FLAGS || ( cat config.log && false)
          echo ::endgroup::

          echo ::group::Distdir
          make distdir VERSION=${{ matrix.config.host }}
          echo ::endgroup::

          cd Hemis-${{ matrix.config.host }}

          echo ::group::Configure
          ./configure --cache-file=../config.cache $BITCOIN_CONFIG_ALL ${{ matrix.config.BITCOIN_CONFIG }} $PARAMS_FLAGS || ( cat config.log && false)
          echo ::endgroup

          echo ::group::Build
          make -j2 ${{ matrix.config.goal }} || ( echo "Build failure. Verbose build follows." && make ${{ matrix.config.goal }} V=1 ; false )
          echo ::endgroup::

          if [ "${{ matrix.config.unit_tests }}" = "true" ] || [ "${{ matrix.config.functional_tests }}" = "true" ]; then
            echo ::group::Params
            ./params/install-params.sh $PARAMS_DIR
            echo ::endgroup::
          fi

          echo ::group::Security-Check
          make -j2 -C src check-security
          echo ::endgroup::

          if [ "${{matrix.config.symbol_check }}" = "true" ]; then
            echo ::group::Symbol-Check
            make -j2 -C src check-symbols
            echo ::endgroup::
          fi

          if [ "${{ matrix.config.unit_tests }}" = "true" ]; then
            echo ::group::Unit-Tests
            echo ::group::Unit-Tests
            if [[ ${{ matrix.config.os }} = ubuntu* ]]; then
              LD_LIBRARY_PATH=$GITHUB_WORKSPACE/depends/"${{ matrix.config.host }}"/lib make -j2 check VERBOSE=1
            else
              make -j2 check VERBOSE=1
            fi
            echo ::endgroup::
          fi

          if [ "${{ matrix.config.functional_tests }}" = "true" ]; then
            echo ::group::Functional-Tests
            test/functional/test_runner.py --combinedlogslen=4000 ${{ matrix.config.test_runner_extra }}
            echo ::endgroup::
          fi
      - name: Zip Windows Builds
        if: ${{ matrix.config.host == 'x86_64-w64-mingw32' }}
        run: zip -rj Hemis-Windows.zip ${{ github.workspace }}/build/Hemis-x86_64-w64-mingw32/release

      - name: Zip Linux Builds
        if: ${{ matrix.config.host == 'x86_64-unknown-linux-gnu' }}
        run: zip -rj Hemis-Linux.zip ${{ github.workspace }}/${{github.run_number}}-x86_64-unknown-linux-gnu/bin
      
      - name: Tar Linux Builds
        if: ${{ matrix.config.host == 'x86_64-unknown-linux-gnu' }}
        # Written to the workspace root, NOT into the directory being tarred: tar
        # would otherwise race against its own growing output, and the pre-release
        # upload below looked for it here anyway.
        run: tar -czf "${{ github.workspace }}/Hemis-Linux.tar.gz" -C "${{ github.workspace }}/${{github.run_number}}-x86_64-unknown-linux-gnu/bin" .

      - name: Checksums
        if: ${{ matrix.config.host == 'x86_64-unknown-linux-gnu' }}
        # ★ Operators cannot tell whether they got what we meant them to publish
        # unless we publish the hashes. install.sh reads this file from the release
        # and refuses to install an artefact it cannot verify.
        run: |
          cd "${{ github.workspace }}"
          sha256sum Hemis-Linux.tar.gz Hemis-Linux.zip > SHA256SUMS
          cat SHA256SUMS

      - name: Zip AArch64 Builds
        if: ${{ matrix.config.host == 'aarch64-linux-gnu' }}
        run: zip -rj Hemis-AArch.zip ${{ github.workspace }}/${{github.run_number}}-aarch64-linux-gnu/bin

      - name: Zip Arm32 Builds
        if: ${{ matrix.config.host == 'arm-linux-gnueabihf' }}
        run: zip -rj Hemis-Arm32.zip ${{ github.workspace }}/${{github.run_number}}-arm-linux-gnueabihf/bin

      - name: Upload Release Windows Builds
        uses: softprops/action-gh-release@v0.1.15
        if: matrix.config.host == 'x86_64-w64-mingw32' && github.event.inputs.release == 'true'
        with:
          name: ${{ github.event.inputs.release-name }}
          tag_name: ${{ github.event.inputs.tags }}
          # ★ WITHOUT THIS THE TAG LANDS ON THE DEFAULT BRANCH, NOT ON WHAT WE BUILT.
          # action-gh-release creates a tag that does not yet exist at target_commitish,
          # which DEFAULTS TO THE REPOSITORY'S DEFAULT BRANCH. Proven by rehearsal run
          # #4: dispatched on feature/ptx-dkg at 60ff2a1, and the tag it produced points
          # at 1b0d7fe -- main's tip. The artefacts and the tag would then disagree about
          # which source produced them, which is the entire thing pinning to a tag is for,
          # and install.sh's REF=v0.1.0-testnet would clone a tree with no testnet/operator/
          # in it at all. github.sha is the dispatched commit.
          target_commitish: ${{ github.sha }}
          prerelease: false
          files: |
            Hemis-Windows.zip
            ${{ github.workspace }}/build/Hemis-x86_64-w64-mingw32/Hemis-*-setup-unsigned.exe

      - name: Upload PreRelease Windows Builds
        uses: softprops/action-gh-release@v2.0.5
        if: matrix.config.host == 'x86_64-w64-mingw32' && github.event.inputs.release == 'false'
        with:
          name: ${{ github.event.inputs.release-name }}
          tag_name: ${{ github.event.inputs.tags }}
          # ★ WITHOUT THIS THE TAG LANDS ON THE DEFAULT BRANCH, NOT ON WHAT WE BUILT.
          # action-gh-release creates a tag that does not yet exist at target_commitish,
          # which DEFAULTS TO THE REPOSITORY'S DEFAULT BRANCH. Proven by rehearsal run
          # #4: dispatched on feature/ptx-dkg at 60ff2a1, and the tag it produced points
          # at 1b0d7fe -- main's tip. The artefacts and the tag would then disagree about
          # which source produced them, which is the entire thing pinning to a tag is for,
          # and install.sh's REF=v0.1.0-testnet would clone a tree with no testnet/operator/
          # in it at all. github.sha is the dispatched commit.
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            Hemis-Windows.zip
            ${{ github.workspace }}/build/Hemis-x86_64-w64-mingw32/Hemis-*-setup-unsigned.exe

      - name: Upload Release Linux Builds
        uses: softprops/action-gh-release@v2.0.5
        if: matrix.config.host == 'x86_64-unknown-linux-gnu' && github.event.inputs.release == 'true'
        with:
          name: ${{ github.event.inputs.release-name }}
          tag_name: ${{ github.event.inputs.tags }}
          # ★ WITHOUT THIS THE TAG LANDS ON THE DEFAULT BRANCH, NOT ON WHAT WE BUILT.
          # action-gh-release creates a tag that does not yet exist at target_commitish,
          # which DEFAULTS TO THE REPOSITORY'S DEFAULT BRANCH. Proven by rehearsal run
